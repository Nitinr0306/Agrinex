# AgriNex - backing services for local development (ADR-0021).
#
# PostgreSQL and Redis only, for developers who run the backend (and later the frontend) from an IDE
# or Maven. The production-shaped stack (root docker-compose.yml with Nginx, frontend and backend,
# and infra/docker-compose.dev.yml) belongs to the deployment work and is not defined here.
#
# Run from the repository root; values come from the local file infra/.env, created once from infra/.env.example
# (docs/LOCAL_DEVELOPMENT_GUIDE.md sections 2 and 4):
#   docker compose --env-file infra/.env -f infra/docker-compose.yml up -d
#
# Ports are published on 127.0.0.1 only. Images are pinned to the approved baseline
# (docs/architecture/CURRENT_TECHNOLOGY_BASELINE.md section 8; ADR-0002).
name: agrinex-dev

services:
  agrinex-db:
    image: postgres:16.15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrinex}
      POSTGRES_USER: ${POSTGRES_USER:-agrinex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: data survives container restarts (FR-16; ADR-0021 item 6).
      - agrinex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  agrinex-redis:
    image: redis:7.4.11-alpine
    # ADR-0018 item 3: no persistence (RDB and AOF disabled), a maxmemory limit with allkeys-lru
    # eviction, and a password. Redis holds only rate-limit counters and the reference-data cache.
    command:
      - sh
      - -c
      - exec redis-server --save '' --appendonly no --maxmemory "$${REDIS_MAXMEMORY}" --maxmemory-policy allkeys-lru --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-128mb}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  agrinex-pgdata:
