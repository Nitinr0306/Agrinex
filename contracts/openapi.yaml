  /api/v1/selling-options/compare:
    post:
      tags: [Selling options]
      operationId: compareSellingOptions
      summary: Compare markets by estimated net realization
      description: |
        The hero flow (spec §16, §21; FR-06 to FR-13; ADR-0010, ADR-0023, ADR-0024). Anonymous callers are
        allowed (F1.1, spec §28). With a valid FARMER or ADMIN access token the recorded search is linked to
        the caller's farmer profile, when one exists; the response is the same. A sent token is resolved to its
        account: an inactive or removed account answers 401 UNAUTHORIZED (ADR-0042, SR-04).
        The origin must be the stored centroid of a district, exactly as `listDistricts` publishes it (6 decimal
        places); any other coordinates answer 400 VALIDATION_FAILED with INVALID_VALUE on `originLat` and
        `originLon`, and nothing is recorded (spec §28; ADR-0039).
        Outcomes:
        - 200 with ranked `options`, winners and reason codes;
        - 200 with empty `options`, `noDataReason: NO_RECENT_PRICE_DATA` and `excludedMarkets` when markets
          are in range but none has a recent observation (spec §29; ADR-0023);
        - 422 NO_MARKETS_IN_RANGE when no VERIFIED, active market with coordinates lies within
          maxDistanceKm (spec §16);
        - 422 UNSUPPORTED_PRICE_UNIT when the commodity's verified unit is not 'Rs./Quintal' (ADR-0008);
        - 422 ESTIMATE_OUT_OF_RANGE when an estimate of any option would exceed the stored precision
          (absolute value above 999999999999.99 INR); nothing is recorded, and no quantity limit applies
          (ADR-0023 item 1; ADR-0040).
        Every 200 result is recorded as a recommendation run, including zero-option results (ADR-0023 item 4).
        Only stored data is used; the government API is never called on this path (spec §31 RULE 1).
