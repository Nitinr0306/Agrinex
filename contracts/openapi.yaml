components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token from AuthResponse: an HS256 JWT valid for 15 minutes with the claims sub (user id),
        role, iat, exp and iss=agrinex (spec §28; ADR-0016). Kept in memory only, never in Web Storage
        (ADR-0017). On 401 UNAUTHORIZED the client refreshes once and retries (spec §29).
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-agrinex_refresh
      description: >-
        Opaque 256-bit refresh token, valid 7 days, rotated on every refresh with reuse detection (spec §28;
        ADR-0016). Set and read only by the server; HttpOnly, Secure, SameSite=Strict, Path=/api/v1/auth
        (ADR-0017). The `__Secure-` prefix is part of the name, and the server reads only the full name
        (ADR-0042). It never appears in a response body. Only its SHA-256 hash is stored.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page number (ADR-0022 item 5).
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size, 1 to 100 (ADR-0022 item 5). Larger values are rejected, not clamped.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OriginHeader:
      name: Origin
      in: header
      required: false
      description: >-
        Must equal the configured public origin (ADR-0017 item 3); browsers send it automatically. It is
        checked before the refresh cookie is read: an absent, `null` or different Origin answers 403
        ORIGIN_NOT_ALLOWED, never 400.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    StateIdPath:
      name: stateId
      in: path
      required: true
      schema:
        $ref: './common.schema.json#/$defs/Uuid'
    DistrictIdPath:
      name: districtId
      in: path
      required: true
      schema:
        $ref: './common.schema.json#/$defs/Uuid'
    CommodityIdPath:
      name: commodityId
      in: path
      required: true
      schema:
        $ref: './common.schema.json#/$defs/Uuid'
    MarketIdPath:
      name: marketId
      in: path
      required: true
      description: >-
        Market id. Public operations serve VERIFIED markets only; PROVISIONAL and MERGED markets answer 404
        there (ADR-0014). Admin operations accept any market.
      schema:
        $ref: './common.schema.json#/$defs/Uuid'
    AlertIdPath:
      name: alertId
      in: path
      required: true
      schema:
        $ref: './common.schema.json#/$defs/Uuid'
    EventIdPath:
      name: eventId
      in: path
      required: true
      schema:
        $ref: './common.schema.json#/$defs/Uuid'
    RunIdPath:
      name: runId
      in: path
      required: true
      schema:
        $ref: './common.schema.json#/$defs/Uuid'
    DatasetTypePath:
      name: datasetType
      in: path
      required: true
      schema:
        $ref: './price-observation.schema.json#/$defs/SourceDataset'
    CommodityIdQueryRequired:
      name: commodityId
      in: query
      required: true
      description: Commodity. Unknown answers 422 REFERENCE_NOT_FOUND.
      schema:
        $ref: './common.schema.json#/$defs/Uuid'
    CommodityIdQueryOptional:
      name: commodityId
      in: query
      required: false
      description: >-
        Restricts the result to one commodity. Required when varietyId or gradeId is given. Unknown answers
        422 REFERENCE_NOT_FOUND.
      schema:
        $ref: './common.schema.json#/$defs/Uuid'
    VarietyIdQuery:
      name: varietyId
      in: query
      required: false
      description: >-
        Exact variety filter (ADR-0010 item 3); must belong to commodityId, otherwise 422 REFERENCE_NOT_FOUND.
        No other variety is substituted.
      schema:
        $ref: './common.schema.json#/$defs/Uuid'
    GradeIdQuery:
      name: gradeId
      in: query
      required: false
      description: Exact grade filter (ADR-0010 item 3); must belong to commodityId.
      schema:
        $ref: './common.schema.json#/$defs/Uuid'
    TrendDays:
      name: days
      in: query
      required: true
      description: Chart window in days, 7 or 30 (F1.15, spec §21; ADR-0025). The trend statistic does not depend on it.
      schema:
        type: integer
        enum: [7, 30]
    AlertStatusQuery:
      name: status
      in: query
      required: false
      description: Only alerts with this status.
      schema:
        $ref: '#/components/schemas/AlertStatus'
    UnreadOnlyQuery:
      name: unreadOnly
      in: query
      required: false
      description: true returns only events with readAt null.
      schema:
        type: boolean
        default: false
    DatasetTypeQuery:
      name: datasetType
      in: query
      required: false
      description: Only runs of this dataset.
      schema:
        $ref: './price-observation.schema.json#/$defs/SourceDataset'
    RunStatusQuery:
      name: status
      in: query
      required: false
      description: Only runs with this status.
      schema:
        $ref: '#/components/schemas/IngestionRunStatus'
    ErrorTypeQuery:
      name: errorType
      in: query
      required: false
      description: Only errors of this type.
      schema:
        $ref: '#/components/schemas/IngestionErrorType'
    ErrorCodeQuery:
      name: errorCode
      in: query
      required: false
      description: Only errors with this code, for example UNKNOWN_COMMODITY.
      schema:
        $ref: '#/components/schemas/IngestionErrorCode'
    ReviewStatusQuery:
      name: reviewStatus
      in: query
      required: false
      description: Only markets with this review status.
      schema:
        $ref: '#/components/schemas/MarketReviewStatus'
    ActiveQuery:
      name: active
      in: query
      required: false
      description: Only active (true) or inactive (false) markets.
      schema:
        type: boolean
    DistrictIdQuery:
      name: districtId
      in: query
      required: false
      description: Only items of this district. Unknown answers 422 REFERENCE_NOT_FOUND.
      schema:
        $ref: './common.schema.json#/$defs/Uuid'
    SearchQuery:
      name: search
      in: query
      required: false
      description: Case-insensitive substring of the name.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    UnitVerifiedQuery:
      name: unitVerified
      in: query
      required: false
      description: true returns commodities with a verified unit; false those without.
      schema:
        type: boolean
    AuditActionQuery:
      name: action
      in: query
      required: false
      description: Only events with this action.
      schema:
        $ref: '#/components/schemas/AdminAuditAction'
  headers:
    X-Correlation-Id:
      description: >-
        Server-generated identifier of the request, written to the structured logs (spec §27) and repeated as
        correlationId in error bodies. A value sent by the client is ignored.
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]{8,100}$'
    Set-Cookie-Refresh:
      description: >-
        Sets the refresh-token cookie: __Secure-agrinex_refresh=<opaque token>; Max-Age=604800;
        Path=/api/v1/auth; HttpOnly; Secure; SameSite=Strict (ADR-0016, ADR-0017, ADR-0042).
      required: true
      schema:
        type: string
        pattern: '^__Secure-agrinex_refresh=[^;]+; Max-Age=604800; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Strict$'
    Set-Cookie-Clear:
      description: 'Clears the refresh-token cookie: __Secure-agrinex_refresh=; Max-Age=0; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Strict.'
      required: true
      schema:
        type: string
        pattern: '^__Secure-agrinex_refresh=; Max-Age=0; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Strict$'
    Cache-Control-NoStore:
      description: Responses that carry tokens are never cached.
      required: true
      schema:
        type: string
        const: no-store
    WWW-Authenticate:
      description: >-
        Authentication challenge required on every 401 (RFC 9110 §15.5.2): Bearer realm="agrinex", with
        error="invalid_token" when a presented access token was rejected (RFC 6750 §3).
      required: true
      schema:
        type: string
        pattern: '^Bearer realm="agrinex"'
    Retry-After:
      description: Seconds until the client may retry (ADR-0017 item 6).
      required: true
      schema:
        type: integer
        minimum: 1
    Location:
      description: Path of the created or started resource.
      required: true
      schema:
        type: string
        format: uri-reference
  responses:
    BadRequest:
      description: >-
        MALFORMED_REQUEST (the body is not valid JSON or not an object) or VALIDATION_FAILED (errors[] lists
        each field problem). Data-independent request checks; ADR-0022 item 4.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/BadRequestError'
    Unauthorized:
      description: >-
        UNAUTHORIZED. The access token is missing, malformed, expired or invalid, or its account is inactive or
        no longer exists: every operation that evaluates the token resolves the caller's account (alerts, admin,
        and compare or simulate when a token is sent; ADR-0042, SR-04). The client refreshes once and retries
        (spec §29); after REFRESH_TOKEN_INVALID it retries operations that also allow anonymous access without
        the token.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    Forbidden:
      description: FORBIDDEN. The caller's role is not permitted (spec §28, FR-20).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
    OriginNotAllowed:
      description: ORIGIN_NOT_ALLOWED. The Origin header does not equal the public origin (ADR-0017).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/OriginNotAllowedError'
    NotFound:
      description: >-
        NOT_FOUND. The resource in the path does not exist or is not visible to the caller (another user's
        alert or event; a PROVISIONAL or MERGED market on a public operation).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
    Conflict:
      description: CONFLICT. The request conflicts with the current state; detail explains it (ADR-0011 item 4).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ConflictError'
    ReferenceNotFound:
      description: >-
        REFERENCE_NOT_FOUND. A well-formed id in the body or query names nothing that exists or qualifies;
        errors[] names each such field with code NOT_FOUND.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ReferenceNotFoundError'
    ComparisonUnprocessable:
      description: |
        Valid request that the data cannot satisfy (ADR-0022 item 4):
        - NO_MARKETS_IN_RANGE, title "Insufficient data": no VERIFIED, active market with coordinates lies
          within maxDistanceKm (spec §16; ADR-0023). The client offers to increase the distance (spec §25).
        - UNSUPPORTED_PRICE_UNIT: the commodity's verified unit is not 'Rs./Quintal' or is unverified (ADR-0008).
        - REFERENCE_NOT_FOUND: an id in the request names nothing that exists.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ComparisonUnprocessableError'
    CompareUnprocessable:
      description: |
        Valid comparison request that the data cannot satisfy (ADR-0022 item 4):
        - NO_MARKETS_IN_RANGE, title "Insufficient data": no VERIFIED, active market with coordinates lies
          within maxDistanceKm (spec §16; ADR-0023). The client offers to increase the distance (spec §25).
        - UNSUPPORTED_PRICE_UNIT: the commodity's verified unit is not 'Rs./Quintal' or is unverified (ADR-0008).
        - REFERENCE_NOT_FOUND: an id in the request names nothing that exists.
        - ESTIMATE_OUT_OF_RANGE, title "Estimate out of range": an estimate would exceed the stored precision
          (ADR-0040); `errors[]` names `quantity` with OUT_OF_RANGE, and nothing is recorded.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CompareUnprocessableError'
    AlertUnprocessable:
      description: >-
        UNSUPPORTED_PRICE_UNIT (the commodity's unit is not 'Rs./Quintal', ADR-0008) or REFERENCE_NOT_FOUND
        (unknown commodity, or a market that is unknown or not VERIFIED).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AlertUnprocessableError'
    RateLimited:
      description: >-
        RATE_LIMITED. The client IP exceeded the operation's fixed one-minute window, too many failed logins
        were made for one identifier (ADR-0017 item 6), or a password-reset or verification-link limit per
        identifier or per account was reached (ADR-0048). The limits also hold when Redis is unavailable
        (ADR-0018).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RateLimitedError'
    UnexpectedError:
      description: >-
        Any other problem, in the same ApiErrorResponse format: METHOD_NOT_ALLOWED (405), NOT_ACCEPTABLE (406),
        UNSUPPORTED_MEDIA_TYPE (415), INTERNAL_ERROR (500) or SERVICE_UNAVAILABLE (503, for example when the
        database is unavailable, spec §29). Never a stack trace (spec §28).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    ApiErrorResponse:
      $ref: './error-response.schema.json'
    BadRequestError:
      allOf:
        - $ref: './error-response.schema.json'
      properties:
        code:
          enum: [MALFORMED_REQUEST, VALIDATION_FAILED]
    UnauthorizedError:
      allOf:
        - $ref: './error-response.schema.json'
      properties:
        code:
          const: UNAUTHORIZED
    InvalidCredentialsError:
      allOf:
        - $ref: './error-response.schema.json'
      properties:
        code:
          const: INVALID_CREDENTIALS
    RefreshTokenInvalidError:
      allOf:
        - $ref: './error-response.schema.json'
      properties:
        code:
          const: REFRESH_TOKEN_INVALID
    ForbiddenError:
      allOf:
        - $ref: './error-response.schema.json'
      properties:
        code:
          const: FORBIDDEN
    OriginNotAllowedError:
      allOf:
        - $ref: './error-response.schema.json'
      properties:
        code:
          const: ORIGIN_NOT_ALLOWED
    NotFoundError:
      allOf:
        - $ref: './error-response.schema.json'
      properties:
        code:
          const: NOT_FOUND
    ConflictError:
      allOf:
        - $ref: './error-response.schema.json'
      properties:
        code:
          const: CONFLICT
    ReferenceNotFoundError:
      allOf:
        - $ref: './error-response.schema.json'
      properties:
        code:
          const: REFERENCE_NOT_FOUND
    ComparisonUnprocessableError:
      allOf:
        - $ref: './error-response.schema.json'
      properties:
        code:
          enum: [NO_MARKETS_IN_RANGE, UNSUPPORTED_PRICE_UNIT, REFERENCE_NOT_FOUND]
    CompareUnprocessableError:
      allOf:
        - $ref: './error-response.schema.json'
      properties:
        code:
          enum: [NO_MARKETS_IN_RANGE, UNSUPPORTED_PRICE_UNIT, REFERENCE_NOT_FOUND, ESTIMATE_OUT_OF_RANGE]
    AlertUnprocessableError:
      allOf:
        - $ref: './error-response.schema.json'
      properties:
        code:
          enum: [UNSUPPORTED_PRICE_UNIT, REFERENCE_NOT_FOUND]
    PasswordResetTokenInvalidError:
      allOf:
        - $ref: './error-response.schema.json'
      properties:
        code:
          const: PASSWORD_RESET_TOKEN_INVALID
    EmailVerificationTokenInvalidError:
      allOf:
        - $ref: './error-response.schema.json'
      properties:
        code:
          const: EMAIL_VERIFICATION_TOKEN_INVALID
    RateLimitedError:
      allOf:
        - $ref: './error-response.schema.json'
      properties:
        code:
          const: RATE_LIMITED
    Role:
      description: >-
        Account role (spec §28). Exactly one per account. BUYER accounts exist only from Phase 2; Phase 1 never
        issues them.
      type: string
      enum: [FARMER, BUYER, ADMIN]
    RegisterRequest:
      type: object
      properties:
        phoneNumber:
          description: >-
            Indian mobile number in E.164 form, +91 followed by 10 digits starting with 6 to 9 (ADR-0016 item
            1). It becomes the login identifier. The frontend normalizes what the farmer types.
          type: string
          pattern: '^\+91[6-9][0-9]{9}$'
        email:
          description: >-
            Email address of the account (ADR-0047). Required. Trimmed and stored in lower case; unique across
            accounts. It is a second login identifier for the same account and password, and the only channel of
            password recovery once verified: a verification link is sent to it after registration (ADR-0048).
            Personal data: never logged.
          type: string
          format: email
          minLength: 3
          maxLength: 254
          pattern: '^[^@\s]+@[^@\s]+$'
        password:
          description: >-
            8 to 64 characters and at most 72 bytes in UTF-8, with no composition rules (FARMER rule, ADR-0016
            item 3). Stored only as a BCrypt hash; never returned or logged.
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 64
        displayName:
          description: Optional name shown to the farmer. Trimmed; 1 to 100 characters.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 100
            - type: 'null'
        defaultDistrictId:
          description: Optional default district for the wizard (spec §20). Unknown answers 422 REFERENCE_NOT_FOUND.
          anyOf:
            - $ref: './common.schema.json#/$defs/Uuid'
            - type: 'null'
      required: [phoneNumber, email, password]
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        identifier:
          description: >-
            The account's mobile number in E.164 form (+91 and 10 digits) or its email address (ADR-0016 item 2;
            ADR-0047). A FARMER may use either; an ADMIN uses the email address. Both name the same account and
            the same password. Surrounding whitespace is trimmed and an email is compared in lower case.
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 64
      required: [identifier, password]
      additionalProperties: false
    AuthenticatedUser:
      description: The signed-in account. Personal data is limited to what the client needs (spec §28).
      type: object
      properties:
        id:
          $ref: './common.schema.json#/$defs/Uuid'
        role:
          $ref: '#/components/schemas/Role'
        displayName:
          description: The farmer profile's display name, or null.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 100
            - type: 'null'
        defaultDistrictId:
          description: The farmer profile's default district, or null.
          anyOf:
            - $ref: './common.schema.json#/$defs/Uuid'
            - type: 'null'
        emailVerified:
          description: >-
            Whether the account's email address is verified (ADR-0047, ADR-0048). Password recovery needs a verified
            email, so while this is false the client offers resendEmailVerification. The address itself is not
            returned.
          type: boolean
      required: [id, role, displayName, defaultDistrictId, emailVerified]
      additionalProperties: false
    PasswordResetRequest:
      description: Start of password recovery (ADR-0047, ADR-0048).
      type: object
      properties:
        identifier:
          description: >-
            The account's mobile number in E.164 form or its email address, normalized like login's identifier.
            The response never reveals whether it names an account.
          type: string
          minLength: 1
          maxLength: 254
      required: [identifier]
      additionalProperties: false
    PasswordResetConfirmRequest:
      description: Completion of password recovery with the token from the reset link (ADR-0048).
      type: object
      properties:
        token:
          description: >-
            The single-use token from the reset link: 256 random bits in base64url without padding. Never logged.
          type: string
          writeOnly: true
          pattern: '^[A-Za-z0-9_-]{43}$'
        newPassword:
          description: >-
            The new password: 8 to 64 characters for FARMER, 15 to 64 for ADMIN, never more than 72 bytes in UTF-8,
            no composition rules (ADR-0016 item 3). Stored only as a BCrypt hash; never returned or logged.
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 64
      required: [token, newPassword]
      additionalProperties: false
    EmailVerificationConfirmRequest:
      description: Confirmation of the account's email with the token from the verification link (ADR-0048).
      type: object
      properties:
        token:
          description: >-
            The single-use token from the verification link: 256 random bits in base64url without padding. Never
            logged.
          type: string
          writeOnly: true
          pattern: '^[A-Za-z0-9_-]{43}$'
      required: [token]
      additionalProperties: false
    AuthResponse:
      description: >-
        Spec §30 AuthResponse. The refresh token is never in the body: it is set as the HttpOnly cookie
        (ADR-0017).
      type: object
      properties:
        accessToken:
          description: >-
            HS256 JWT (ADR-0016 item 4). Keep it in memory only. Clients use `user` and `expiresIn` instead of
            decoding it.
          type: string
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          description: Lifetime of the access token in seconds; 900 (15 minutes, spec §28).
          type: integer
          minimum: 1
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
      required: [accessToken, tokenType, expiresIn, user]
      additionalProperties: false
    StateResponse:
      description: A state (spec §30 StateResponse).
      $ref: './common.schema.json#/$defs/StateRef'
    DistrictResponse:
      description: A district with its centroid (spec §30 DistrictResponse).
      type: object
      properties:
        id:
          $ref: './common.schema.json#/$defs/Uuid'
        stateId:
          $ref: './common.schema.json#/$defs/Uuid'
        name:
          $ref: './common.schema.json#/$defs/ReferenceName'
        centroid:
          description: >-
            District centroid computed from the Survey of India district boundary (ADR-0014 item 2). The
            frontend sends it as originLat and originLon (spec §21 step 3).
          $ref: './common.schema.json#/$defs/GeoPoint'
      required: [id, stateId, name, centroid]
      additionalProperties: false
    LocalityResponse:
      description: An LGD sub-district (taluka), without coordinates in Phase 1 (spec §30 LocalityResponse; ADR-0014).
      type: object
      properties:
        id:
          $ref: './common.schema.json#/$defs/Uuid'
        districtId:
          $ref: './common.schema.json#/$defs/Uuid'
        name:
          $ref: './common.schema.json#/$defs/ReferenceName'
      required: [id, districtId, name]
      additionalProperties: false
    StateListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StateResponse'
      required: [items]
      additionalProperties: false
    DistrictListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DistrictResponse'
      required: [items]
      additionalProperties: false
    LocalityListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LocalityResponse'
      required: [items]
      additionalProperties: false
    CommodityResponse:
      description: A commodity offered in the comparison wizard (spec §30 CommodityResponse).
      type: object
      properties:
        id:
          $ref: './common.schema.json#/$defs/Uuid'
        name:
          $ref: './common.schema.json#/$defs/ReferenceName'
        nameHi:
          $ref: './common.schema.json#/$defs/LocalizedNameValue'
        nameMr:
          $ref: './common.schema.json#/$defs/LocalizedNameValue'
        category:
          description: Official Agmarknet commodity group, for example Vegetables (ADR-0006 item 4), or null.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 100
            - type: 'null'
        priceUnit:
          description: >-
            The commodity's verified price unit (ADR-0008). Comparison and alerts accept only 'Rs./Quintal';
            clients do not offer a commodity with another unit for comparison.
          $ref: './price-observation.schema.json#/$defs/PriceUnit'
      required: [id, name, nameHi, nameMr, category, priceUnit]
      additionalProperties: false
    VarietyResponse:
      description: A variety of a commodity (spec §30 VarietyResponse).
      type: object
      properties:
        id:
          $ref: './common.schema.json#/$defs/Uuid'
        commodityId:
          $ref: './common.schema.json#/$defs/Uuid'
        name:
          $ref: './common.schema.json#/$defs/ReferenceName'
      required: [id, commodityId, name]
      additionalProperties: false
    GradeResponse:
      description: A grade of a commodity (spec §20 GRADES).
      type: object
      properties:
        id:
          $ref: './common.schema.json#/$defs/Uuid'
        commodityId:
          $ref: './common.schema.json#/$defs/Uuid'
        name:
          $ref: './common.schema.json#/$defs/ReferenceName'
      required: [id, commodityId, name]
      additionalProperties: false
    CommodityListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommodityResponse'
      required: [items]
      additionalProperties: false
    VarietyListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VarietyResponse'
      required: [items]
      additionalProperties: false
    GradeListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GradeResponse'
      required: [items]
      additionalProperties: false
    PriceQuote:
      description: Exported name for code generators; operations reference the contract file directly.
      $ref: './price-observation.schema.json#/$defs/PriceQuote'
    PriceObservation:
      description: >-
        Exported name of the self-contained observation (spec §41 price-observation contract) for consumers such
        as QA fixtures; no operation returns it directly.
      $ref: './price-observation.schema.json'
    SourceSyncStatus:
      description: Exported name for code generators; operations reference the contract file directly.
      $ref: './price-observation.schema.json#/$defs/SourceSyncStatus'
    MarketLatestPrice:
      description: The latest qualifying observation of one commodity at the market (ADR-0010).
      type: object
      properties:
        commodity:
          $ref: './common.schema.json#/$defs/CommodityRef'
        price:
          $ref: './price-observation.schema.json#/$defs/PriceQuote'
      required: [commodity, price]
      additionalProperties: false
    MarketDetailResponse:
      description: Spec §30 MarketDetailResponse.
      type: object
      properties:
        market:
          $ref: './common.schema.json#/$defs/MarketSummary'
        active:
          description: false when an admin has withdrawn the market from comparisons (spec §16 is_active).
          type: boolean
        approximateMarketLocation:
          description: true when the market's coordinates are its district centroid (ADR-0014).
          type: boolean
        latestPrices:
          description: One entry per commodity with a qualifying observation, ordered by commodity name (code-point order, then id).
          type: array
          items:
            $ref: '#/components/schemas/MarketLatestPrice'
        noDataReason:
          description: NO_RECENT_PRICE_DATA exactly when latestPrices is empty; otherwise null.
          anyOf:
            - $ref: './price-observation.schema.json#/$defs/NoDataReason'
            - type: 'null'
        sourceStatus:
          $ref: './price-observation.schema.json#/$defs/SourceSyncStatus'
      required: [market, active, approximateMarketLocation, latestPrices, noDataReason, sourceStatus]
      additionalProperties: false
    TrendWindow:
      description: >-
        Window bounds as Asia/Kolkata calendar dates (ADR-0025). recent = today minus 6 to today; baseline =
        today minus 13 to today minus 7; chart = the last `days` days ending today.
      type: object
      properties:
        chartFrom:
          $ref: './common.schema.json#/$defs/CalendarDate'
        chartTo:
          $ref: './common.schema.json#/$defs/CalendarDate'
        recentFrom:
          $ref: './common.schema.json#/$defs/CalendarDate'
        recentTo:
          $ref: './common.schema.json#/$defs/CalendarDate'
        baselineFrom:
          $ref: './common.schema.json#/$defs/CalendarDate'
        baselineTo:
          $ref: './common.schema.json#/$defs/CalendarDate'
      required: [chartFrom, chartTo, recentFrom, recentTo, baselineFrom, baselineTo]
      additionalProperties: false
    TrendResponse:
      description: Spec §30 TrendResponse (spec §21 step 32; ADR-0025 item 3).
      type: object
      properties:
        market:
          $ref: './common.schema.json#/$defs/MarketRef'
        commodity:
          $ref: './common.schema.json#/$defs/CommodityRef'
        variety:
          description: The variety filter applied, or null.
          anyOf:
            - $ref: './common.schema.json#/$defs/VarietyRef'
            - type: 'null'
        grade:
          description: The grade filter applied, or null.
          anyOf:
            - $ref: './common.schema.json#/$defs/GradeRef'
            - type: 'null'
        priceUnit:
          description: Unit of every price in `observations`; null only when the commodity has no verified unit (then `observations` is empty).
          anyOf:
            - $ref: './price-observation.schema.json#/$defs/PriceUnit'
            - type: 'null'
        days:
          type: integer
          enum: [7, 30]
        window:
          $ref: '#/components/schemas/TrendWindow'
        trendDirection:
          $ref: './price-observation.schema.json#/$defs/TrendDirection'
        changePercent7Day:
          $ref: './price-observation.schema.json#/$defs/ChangePercent7Day'
        observations:
          description: >-
            The daily series (spec §21 step 32 `observations`): one selected real observation per date with data
            inside the chart window, ascending by reportDate. Dates without data are absent (spec §31 RULE 5).
          type: array
          items:
            $ref: './price-observation.schema.json#/$defs/PriceQuote'
        sourceStatus:
          $ref: './price-observation.schema.json#/$defs/SourceSyncStatus'
      required: [market, commodity, variety, grade, priceUnit, days, window, trendDirection, changePercent7Day, observations, sourceStatus]
      additionalProperties: false
    ForecastSeries:
      description: >-
        The latest generation for one horizon, limited to points dated today or later (Asia/Kolkata; ADR-0030
        item 4). Field names follow the spec §35 output; every value is exactly as the ML job wrote it.
      type: object
      properties:
        forecastHorizonDays:
          description: 3 or 7 (spec §35).
          type: integer
          enum: [3, 7]
        modelName:
          type: string
          minLength: 1
          maxLength: 100
        modelVersion:
          type: string
          minLength: 1
          maxLength: 50
        generatedAt:
          $ref: './common.schema.json#/$defs/Timestamp'
        trainingDataThrough:
          $ref: './common.schema.json#/$defs/CalendarDate'
        mae:
          description: Validation MAE reported by the ML job for this model version, in the price unit, or null (spec §35, §36).
          anyOf:
            - type: number
              minimum: 0
              x-agrinex-max-decimal-places: 4
            - type: 'null'
        rmse:
          description: Validation RMSE reported by the ML job for this model version, in the price unit, or null.
          anyOf:
            - type: number
              minimum: 0
              x-agrinex-max-decimal-places: 4
            - type: 'null'
        forecast:
          description: Predicted points dated today or later, ascending by date (spec §35 forecast[]).
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ForecastPointResponse'
      required: [forecastHorizonDays, modelName, modelVersion, generatedAt, trainingDataThrough, mae, rmse, forecast]
      additionalProperties: false
    ForecastPointResponse:
      description: >-
        One predicted point as served to clients (spec §35 forecast[] item). Defined here, not by reference to
        forecast-output.schema.json, so that a change of the ML output never changes the public response
        without consumer review (spec §41).
      type: object
      properties:
        date:
          $ref: './common.schema.json#/$defs/CalendarDate'
        predictedPrice:
          description: Predicted modal price in priceUnit, as the model produced it.
          type: number
          x-agrinex-max-decimal-places: 2
        lowerBound:
          description: Lower bound as the model produced it, or null. No coverage level is recorded, so it is never a confidence percentage.
          anyOf:
            - type: number
              x-agrinex-max-decimal-places: 2
            - type: 'null'
        upperBound:
          description: Upper bound as the model produced it, or null.
          anyOf:
            - type: number
              x-agrinex-max-decimal-places: 2
            - type: 'null'
      required: [date, predictedPrice, lowerBound, upperBound]
      additionalProperties: false
    ForecastResponse:
      description: |
        Spec §29 and §35 ForecastResponse. `available: false` is the normal state without ML: it carries no
        prediction, and clients show "Forecast unavailable." only in the optional forecast section (spec §29).
        When available, the response is clearly a model prediction (`kind: ML_FORECAST`), built on the
        representative daily series of government-reported observations (ADR-0030 item 5). It never replaces
        or changes an observed price, and no confidence percentage exists: only the bounds the model produced.
      type: object
      properties:
        available:
          type: boolean
        kind:
          description: Marks every value in this response as an ML prediction, not a reported price.
          type: string
          const: ML_FORECAST
        inputBasis:
          description: The input the model was trained on (ADR-0030 item 5).
          type: string
          const: REPRESENTATIVE_DAILY_SERIES
        market:
          $ref: './common.schema.json#/$defs/MarketRef'
        commodity:
          $ref: './common.schema.json#/$defs/CommodityRef'
        priceUnit:
          description: Unit of every predicted price and bound; the commodity's verified unit, or null when unverified.
          anyOf:
            - $ref: './price-observation.schema.json#/$defs/PriceUnit'
            - type: 'null'
        forecasts:
          description: One entry per available horizon, ordered by forecastHorizonDays. Empty exactly when available is false.
          type: array
          items:
            $ref: '#/components/schemas/ForecastSeries'
      required: [available, kind, inputBasis, market, commodity, priceUnit, forecasts]
      additionalProperties: false
      allOf:
        - if:
            properties:
              available:
                const: false
            required: [available]
          then:
            properties:
              forecasts:
                maxItems: 0
          else:
            properties:
              forecasts:
                minItems: 1
    MarketComparisonResponse:
      $ref: './recommendation.schema.json'
    AlertType:
      description: >-
        Spec §34: PRICE_ABOVE (latest modal price >= threshold), PRICE_BELOW (<= threshold), PERCENTAGE_RISE
        (changePercent7Day >= threshold), PERCENTAGE_FALL (changePercent7Day <= -threshold). Percentage
        conditions use the unrounded 7-day change, as the trend classification does (ADR-0019 item 2, ADR-0025
        item 1); the trend operations display it to 1 decimal place.
      type: string
      enum: [PRICE_ABOVE, PRICE_BELOW, PERCENTAGE_RISE, PERCENTAGE_FALL]
    AlertStatus:
      description: ACTIVE alerts are evaluated after each ingestion run; PAUSED alerts are not (spec §34).
      type: string
      enum: [ACTIVE, PAUSED]
    ThresholdValue:
      description: >-
        For PRICE_ABOVE and PRICE_BELOW, a price in the commodity's unit ('Rs./Quintal'). For PERCENTAGE_RISE
        and PERCENTAGE_FALL, a positive percentage magnitude, for example 5.0 for 5 % (spec §34). Greater than
        0; at most 10 integer and 4 fraction digits (price_alerts.threshold_value numeric(14,4)).
      type: number
      exclusiveMinimum: 0
      maximum: 9999999999.9999
      x-agrinex-max-decimal-places: 4
    CreateAlertRequest:
      type: object
      properties:
        alertType:
          $ref: '#/components/schemas/AlertType'
        commodityId:
          $ref: './common.schema.json#/$defs/Uuid'
        marketId:
          description: >-
            Optional market (spec §25 "marketId optional"). Without one, the alert covers every VERIFIED,
            active market, and an event names the market with the most extreme qualifying value (ADR-0019
            item 3).
          anyOf:
            - $ref: './common.schema.json#/$defs/Uuid'
            - type: 'null'
        thresholdValue:
          $ref: '#/components/schemas/ThresholdValue'
      required: [alertType, commodityId, thresholdValue]
      additionalProperties: false
    UpdateAlertStatusRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/AlertStatus'
      required: [status]
      additionalProperties: false
    AlertResponse:
      description: Spec §30 AlertResponse.
      type: object
      properties:
        id:
          $ref: './common.schema.json#/$defs/Uuid'
        alertType:
          $ref: '#/components/schemas/AlertType'
        status:
          $ref: '#/components/schemas/AlertStatus'
        commodity:
          $ref: './common.schema.json#/$defs/CommodityRef'
        market:
          description: The market, or null for an alert over all markets.
          anyOf:
            - $ref: './common.schema.json#/$defs/MarketRef'
            - type: 'null'
        thresholdValue:
          $ref: '#/components/schemas/ThresholdValue'
        priceUnit:
          description: Unit of a price threshold and of price trigger values; the commodity's verified unit.
          $ref: './price-observation.schema.json#/$defs/PriceUnit'
        lastTriggeredAt:
          description: Time of the latest event, or null.
          anyOf:
            - $ref: './common.schema.json#/$defs/Timestamp'
            - type: 'null'
      required: [id, alertType, status, commodity, market, thresholdValue, priceUnit, lastTriggeredAt]
      additionalProperties: false
    AlertPage:
      allOf:
        - $ref: './common.schema.json#/$defs/PageMetadata'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertResponse'
      required: [items]
      unevaluatedProperties: false
    AlertEventResponse:
      description: >-
        One trigger of an alert by an ingestion run (ADR-0019 item 4): the market that met the condition and
        the observation behind the trigger value, with full provenance.
      type: object
      properties:
        id:
          $ref: './common.schema.json#/$defs/Uuid'
        alertId:
          $ref: './common.schema.json#/$defs/Uuid'
        alertType:
          $ref: '#/components/schemas/AlertType'
        thresholdValue:
          $ref: '#/components/schemas/ThresholdValue'
        commodity:
          $ref: './common.schema.json#/$defs/CommodityRef'
        market:
          $ref: './common.schema.json#/$defs/MarketRef'
        triggeredAt:
          $ref: './common.schema.json#/$defs/Timestamp'
        triggerValue:
          description: >-
            The value that met the condition: the latest modal price in priceUnit for price alerts, or the
            unrounded 7-day change in percent (possibly negative) for percentage alerts, stored rounded half-up to
            4 decimal places (spec §34; alert_events.trigger_value numeric(14,4)).
          type: number
          x-agrinex-max-decimal-places: 4
        priceUnit:
          $ref: './price-observation.schema.json#/$defs/PriceUnit'
        observation:
          description: >-
            The observation selected behind triggerValue (ADR-0010, ADR-0019), with its current values: a later
            source revision (ADR-0009) can change its prices, while triggerValue keeps the value at trigger time.
          $ref: './price-observation.schema.json#/$defs/PriceQuote'
        readAt:
          description: When the caller viewed or dismissed the event, or null when unread.
          anyOf:
            - $ref: './common.schema.json#/$defs/Timestamp'
            - type: 'null'
      required: [id, alertId, alertType, thresholdValue, commodity, market, triggeredAt, triggerValue, priceUnit, observation, readAt]
      additionalProperties: false
    AlertEventPage:
      allOf:
        - $ref: './common.schema.json#/$defs/PageMetadata'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertEventResponse'
        sourceStatus:
          $ref: './price-observation.schema.json#/$defs/SourceSyncStatus'
      required: [items, sourceStatus]
      unevaluatedProperties: false
    ComponentHealth:
      description: Health of an internal component, from the backend's health checks (spec §27; ADR-0018).
      type: string
      enum: [UP, DOWN, UNKNOWN]
    SystemStatusResponse:
      type: object
      properties:
        generatedAt:
          $ref: './common.schema.json#/$defs/Timestamp'
        components:
          type: object
          properties:
            database:
              $ref: '#/components/schemas/ComponentHealth'
            redis:
              description: Redis DOWN degrades rate limiting and caching to in-process fallbacks; the service stays available (ADR-0018).
              $ref: '#/components/schemas/ComponentHealth'
          required: [database, redis]
          additionalProperties: false
        governmentApiKey:
          description: Whether DATA_GOV_API_KEY is configured. The value itself is never exposed (ADR-0020 item 2).
          type: string
          enum: [CONFIGURED, NOT_CONFIGURED]
        schedule:
          description: The configured ingestion schedule (ADR-0011 item 1). Read-only.
          type: object
          properties:
            timeZone:
              type: string
              const: Asia/Kolkata
            runTimes:
              description: Local times of the scheduled runs, for example 00:00, 06:00, 12:00 and 18:00.
              type: array
              minItems: 1
              items:
                type: string
                pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
            historicalWindowDaysBack:
              description: Scheduled HISTORICAL_PRICE runs cover report dates from today minus this many days to today (3).
              type: integer
              minimum: 0
          required: [timeZone, runTimes, historicalWindowDaysBack]
          additionalProperties: false
        coverage:
          description: Coverage is deployment configuration (ADR-0006 item 1). Read-only.
          type: object
          properties:
            sourceStates:
              description: Source state values ingested, for example Maharashtra.
              type: array
              items:
                type: string
                minLength: 1
          required: [sourceStates]
          additionalProperties: false
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/DatasetIdentity'
      required: [generatedAt, components, governmentApiKey, schedule, coverage, datasets]
      additionalProperties: false
    DatasetIdentity:
      type: object
      properties:
        datasetType:
          $ref: './price-observation.schema.json#/$defs/SourceDataset'
        resourceId:
          $ref: './price-observation.schema.json#/$defs/DataGovResourceId'
        title:
          description: Official resource title (source_datasets.title).
          type: string
          minLength: 1
          maxLength: 300
      required: [datasetType, resourceId, title]
      additionalProperties: false
    IngestionRunStatus:
      description: RUNNING, SUCCESS, PARTIAL_FAILURE or FAILED (spec §15, §29; status rule ADR-0011 item 8).
      type: string
      enum: [RUNNING, SUCCESS, PARTIAL_FAILURE, FAILED]
    TriggeredBy:
      description: What started the run (spec §15).
      type: string
      enum: [SCHEDULER, MANUAL, STARTUP]
    IngestionErrorType:
      description: VALIDATION, API_ERROR, CONFLICT, SCHEMA_ERROR or SYSTEM (ADR-0009, ADR-0011 item 9).
      type: string
      enum: [VALIDATION, API_ERROR, CONFLICT, SCHEMA_ERROR, SYSTEM]
    IngestionErrorCode:
      description: >-
        UPPER_SNAKE code of an ingestion error, for example UNKNOWN_COMMODITY, UNIT_UNVERIFIED, PRICE_OUTLIER,
        SAME_KEY_DIFFERENT_PRICES, HTTP_STATUS, NON_JSON_RESPONSE or RUN_INTERRUPTED (ADR-0008, ADR-0009,
        ADR-0011). The list is open: the ingestion module may add codes.
      type: string
      pattern: '^[A-Z][A-Z0-9_]*$'
      maxLength: 50
    IngestionRunResponse:
      description: Spec §30 IngestionRunResponse. Counters satisfy the accounting invariant of ADR-0012 for SUCCESS and PARTIAL_FAILURE runs.
      type: object
      properties:
        id:
          $ref: './common.schema.json#/$defs/Uuid'
        datasetType:
          $ref: './price-observation.schema.json#/$defs/SourceDataset'
        triggeredBy:
          $ref: '#/components/schemas/TriggeredBy'
        status:
          $ref: '#/components/schemas/IngestionRunStatus'
        startedAt:
          $ref: './common.schema.json#/$defs/Timestamp'
        finishedAt:
          description: null while RUNNING.
          anyOf:
            - $ref: './common.schema.json#/$defs/Timestamp'
            - type: 'null'
        durationSeconds:
          description: finishedAt minus startedAt in whole seconds, rounded half-up; null while RUNNING.
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
        requestScope:
          description: >-
            Request parameters of the run, such as the state filter, report dates and page size. Never contains
            credentials (ADR-0020 item 5).
          type: object
          additionalProperties: true
          x-agrinex-free-form: true
        sourceTotalRecords:
          description: The total the source reported for the run scope, or null.
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
        pagesFetched:
          type: integer
          minimum: 0
        pagesFailed:
          description: Pages that failed after retries (the "Y pages failed" of spec §29).
          type: integer
          minimum: 0
        recordsFetched:
          type: integer
          minimum: 0
        recordsInserted:
          type: integer
          minimum: 0
        recordsUpdated:
          description: Records that revised the prices of a stored observation (ADR-0009).
          type: integer
          minimum: 0
        duplicatesSkipped:
          type: integer
          minimum: 0
        validationErrorsCount:
          type: integer
          minimum: 0
        recordsConflicted:
          description: Records quarantined as same-key conflicts (ADR-0009).
          type: integer
          minimum: 0
        recordsOutOfScope:
          type: integer
          minimum: 0
        completenessPercent:
          description: >-
            (recordsInserted + recordsUpdated + duplicatesSkipped) / (recordsFetched - recordsOutOfScope) x 100,
            rounded half-up to 2 decimal places (formula ADR-0012 item 2; the rounding is a contract-design choice).
            null while RUNNING or when the denominator is 0. The spec §48 threshold is at least 95 per run.
          anyOf:
            - type: number
              minimum: 0
              maximum: 100
              x-agrinex-max-decimal-places: 2
            - type: 'null'
        errorCount:
          description: >-
            Number of error rows of the run currently retained (all types). Errors are purged after 180 days
            while runs are kept (ADR-0029), so for older runs it can be lower than the counters imply.
          type: integer
          minimum: 0
      required:
        - id
        - datasetType
        - triggeredBy
        - status
        - startedAt
        - finishedAt
        - durationSeconds
        - requestScope
        - sourceTotalRecords
        - pagesFetched
        - pagesFailed
        - recordsFetched
        - recordsInserted
        - recordsUpdated
        - duplicatesSkipped
        - validationErrorsCount
        - recordsConflicted
        - recordsOutOfScope
        - completenessPercent
        - errorCount
      additionalProperties: false
    IngestionRunPage:
      allOf:
        - $ref: './common.schema.json#/$defs/PageMetadata'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IngestionRunResponse'
      required: [items]
      unevaluatedProperties: false
    IngestionErrorResponse:
      type: object
      properties:
        id:
          $ref: './common.schema.json#/$defs/Uuid'
        runId:
          $ref: './common.schema.json#/$defs/Uuid'
        errorType:
          $ref: '#/components/schemas/IngestionErrorType'
        errorCode:
          $ref: '#/components/schemas/IngestionErrorCode'
        errorMessage:
          description: >-
            Field and reason, or the HTTP outcome. Never contains the API key: ingestion removes the configured
            key and any api-key parameter before storing text (ADR-0020 item 5; spec §47 Q21).
          type: string
          minLength: 1
        pageOffset:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
        requestReportDate:
          description: The requested report date when a HISTORICAL delivery unit failed (ADR-0011), otherwise null.
          anyOf:
            - $ref: './common.schema.json#/$defs/CalendarDate'
            - type: 'null'
        rawPayloadExcerpt:
          description: >-
            The rejected source record or error response body as compact JSON text (ADR-0020 item 2 "raw-payload
            excerpts"), cut to at most 4,000 characters (a contract-design limit), or null when none was kept. The configured API key and any api-key
            parameter are removed before storage (ADR-0020 item 5).
          anyOf:
            - type: string
              maxLength: 4000
            - type: 'null'
        rawPayloadTruncated:
          description: true when rawPayloadExcerpt was cut.
          type: boolean
        createdAt:
          $ref: './common.schema.json#/$defs/Timestamp'
      required: [id, runId, errorType, errorCode, errorMessage, pageOffset, requestReportDate, rawPayloadExcerpt, rawPayloadTruncated, createdAt]
      additionalProperties: false
    IngestionErrorPage:
      allOf:
        - $ref: './common.schema.json#/$defs/PageMetadata'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IngestionErrorResponse'
      required: [items]
      unevaluatedProperties: false
    DatasetScheduleState:
      description: Pause state of a dataset's scheduled runs (ADR-0020).
      type: object
      properties:
        datasetType:
          $ref: './price-observation.schema.json#/$defs/SourceDataset'
        paused:
          type: boolean
        pausedReason:
          description: Present exactly while paused.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 500
            - type: 'null'
        updatedAt:
          $ref: './common.schema.json#/$defs/Timestamp'
      required: [datasetType, paused, pausedReason, updatedAt]
      additionalProperties: false
      allOf:
        - if:
            properties:
              paused:
                const: true
            required: [paused]
          then:
            properties:
              pausedReason:
                type: string
          else:
            properties:
              pausedReason:
                type: 'null'
    MarketFreshnessSummary:
      description: >-
        Freshness of the VERIFIED, active markets as of today (Asia/Kolkata), each classified by its latest
        observation date across commodities with the active thresholds; markets without observations count as
        unavailable (spec §46 "3 markets STALE").
      type: object
      properties:
        asOfDate:
          $ref: './common.schema.json#/$defs/CalendarDate'
        totalMarkets:
          type: integer
          minimum: 0
        fresh:
          type: integer
          minimum: 0
        recent:
          type: integer
          minimum: 0
        stale:
          type: integer
          minimum: 0
        unavailable:
          type: integer
          minimum: 0
      required: [asOfDate, totalMarkets, fresh, recent, stale, unavailable]
      additionalProperties: false
    DatasetHealth:
      type: object
      properties:
        datasetType:
          $ref: './price-observation.schema.json#/$defs/SourceDataset'
        resourceId:
          $ref: './price-observation.schema.json#/$defs/DataGovResourceId'
        title:
          type: string
          minLength: 1
          maxLength: 300
        schedule:
          $ref: '#/components/schemas/DatasetScheduleState'
        runningRunId:
          description: The RUNNING run, or null.
          anyOf:
            - $ref: './common.schema.json#/$defs/Uuid'
            - type: 'null'
        latestCompletedRun:
          description: The most recent run that is no longer RUNNING, or null.
          anyOf:
            - $ref: '#/components/schemas/IngestionRunResponse'
            - type: 'null'
        lastSuccessfulRunAt:
          description: End of the most recent run that ended SUCCESS or PARTIAL_FAILURE, or null.
          anyOf:
            - $ref: './common.schema.json#/$defs/Timestamp'
            - type: 'null'
        consecutiveFailures:
          description: >-
            Number of FAILED runs counted back from the most recent completed run until a SUCCESS or
            PARTIAL_FAILURE run (ADR-0019 item 7). Drives the admin dashboard banner.
          type: integer
          minimum: 0
        latestReportDate:
          description: Newest report date stored from this dataset, or null.
          anyOf:
            - $ref: './common.schema.json#/$defs/CalendarDate'
            - type: 'null'
      required: [datasetType, resourceId, title, schedule, runningRunId, latestCompletedRun, lastSuccessfulRunAt, consecutiveFailures, latestReportDate]
      additionalProperties: false
    IngestionHealthResponse:
      description: Spec §30 IngestionHealthResponse.
      type: object
      properties:
        generatedAt:
          $ref: './common.schema.json#/$defs/Timestamp'
        datasets:
          description: One entry per dataset, CURRENT_PRICE first.
          type: array
          items:
            $ref: '#/components/schemas/DatasetHealth'
        marketFreshness:
          $ref: '#/components/schemas/MarketFreshnessSummary'
      required: [generatedAt, datasets, marketFreshness]
      additionalProperties: false
    ReportDateStatus:
      description: >-
        Status of a HISTORICAL_PRICE report date (ADR-0054 item 2), with a settle age equal to the trailing window's
        depth: SETTLED (fetched successfully when at least the settle age old), PENDING (younger than the settle
        age), UNSETTLED (old enough, but fetched successfully only earlier), FAILED (the last attempt failed) or
        MISSING (never attempted).
      type: string
      enum: [SETTLED, PENDING, UNSETTLED, FAILED, MISSING]
    RunPurpose:
      description: >-
        Why a HISTORICAL_PRICE run was started (ADR-0054 item 5), also recorded as `purpose` in its requestScope:
        the 6-hourly trailing window, the daily gap check, the weekly reconciliation or an admin trigger.
      type: string
      enum: [TRAILING_WINDOW, GAP_BACKFILL, RECONCILIATION, MANUAL]
    ReportDateStatusCounts:
      description: Covered report dates per status; the five counts add up to the number of covered dates.
      type: object
      properties:
        settled:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        unsettled:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        missing:
          type: integer
          minimum: 0
      required: [settled, pending, unsettled, failed, missing]
      additionalProperties: false
    ReportDateCoverage:
      description: One incomplete report date with its ledger values.
      type: object
      properties:
        reportDate:
          $ref: './common.schema.json#/$defs/CalendarDate'
        status:
          $ref: '#/components/schemas/ReportDateStatus'
        lastAttemptAt:
          description: The last attempt, or null when never attempted.
          anyOf:
            - $ref: './common.schema.json#/$defs/Timestamp'
            - type: 'null'
        lastSuccessAt:
          description: The last successful fetch, or null.
          anyOf:
            - $ref: './common.schema.json#/$defs/Timestamp'
            - type: 'null'
        recordsFetched:
          description: Records fetched by the last successful fetch; null when unknown or never fetched.
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
        consecutiveFailures:
          description: Failed attempts since the last successful fetch.
          type: integer
          minimum: 0
      required: [reportDate, status, lastAttemptAt, lastSuccessAt, recordsFetched, consecutiveFailures]
      additionalProperties: false
    HistoricalRunProgress:
      description: >-
        Progress of the RUNNING HISTORICAL_PRICE run: the report dates it has attempted so far out of those in its
        scope.
      type: object
      properties:
        runId:
          $ref: './common.schema.json#/$defs/Uuid'
        purpose:
          description: The run's purpose; null for a run recorded before purposes existed.
          anyOf:
            - $ref: '#/components/schemas/RunPurpose'
            - type: 'null'
        reportDateFrom:
          $ref: './common.schema.json#/$defs/CalendarDate'
        reportDateTo:
          $ref: './common.schema.json#/$defs/CalendarDate'
        datesInScope:
          type: integer
          minimum: 1
          maximum: 366
        datesAttempted:
          type: integer
          minimum: 0
          maximum: 366
      required: [runId, purpose, reportDateFrom, reportDateTo, datesInScope, datesAttempted]
      additionalProperties: false
    HistoricalCoverageResponse:
      description: Coverage of the HISTORICAL_PRICE report dates (ADR-0054 item 6).
      type: object
      properties:
        generatedAt:
          $ref: './common.schema.json#/$defs/Timestamp'
        coverageFrom:
          description: The oldest covered report date.
          $ref: './common.schema.json#/$defs/CalendarDate'
        coverageTo:
          description: The newest covered report date, today in Asia/Kolkata.
          $ref: './common.schema.json#/$defs/CalendarDate'
        settleAfterDays:
          description: The settle age in days, the depth of the trailing window (ADR-0011 item 1).
          type: integer
          minimum: 0
        scheduledRunsPaused:
          description: Whether scheduled HISTORICAL_PRICE runs, the gap check and reconciliation included, are paused.
          type: boolean
        counts:
          $ref: '#/components/schemas/ReportDateStatusCounts'
        incompleteDates:
          description: Covered dates in status UNSETTLED, FAILED or MISSING, newest first.
          type: array
          maxItems: 366
          items:
            $ref: '#/components/schemas/ReportDateCoverage'
        runningRun:
          description: The RUNNING HISTORICAL_PRICE run with a report-date range, or null.
          anyOf:
            - $ref: '#/components/schemas/HistoricalRunProgress'
            - type: 'null'
        nextGapCheckAt:
          description: The next daily gap check, or null when the schedule has no next time.
          anyOf:
            - $ref: './common.schema.json#/$defs/Timestamp'
            - type: 'null'
        nextReconciliationAt:
          description: The next weekly reconciliation, or null when the schedule has no next time.
          anyOf:
            - $ref: './common.schema.json#/$defs/Timestamp'
            - type: 'null'
        maxDatesPerGapRun:
          type: integer
          minimum: 1
          maximum: 366
        reconciliationWindowDays:
          type: integer
          minimum: 1
          maximum: 366
      required: [generatedAt, coverageFrom, coverageTo, settleAfterDays, scheduledRunsPaused, counts, incompleteDates, runningRun, nextGapCheckAt, nextReconciliationAt, maxDatesPerGapRun, reconciliationWindowDays]
      additionalProperties: false
    TriggerIngestionRequest:
      description: >-
        Spec §45 trigger body, extended by ADR-0011 item 3. fromDate and toDate are allowed only for
        HISTORICAL_PRICE, must be given together, fromDate <= toDate <= today (Asia/Kolkata), and cover at most
        366 report dates, counted inclusively: toDate - fromDate + 1 <= 366 (VALIDATION_FAILED with INVALID_RANGE
        or NOT_ALLOWED otherwise).
      type: object
      properties:
        datasetType:
          $ref: './price-observation.schema.json#/$defs/SourceDataset'
        fromDate:
          anyOf:
            - $ref: './common.schema.json#/$defs/CalendarDate'
            - type: 'null'
        toDate:
          anyOf:
            - $ref: './common.schema.json#/$defs/CalendarDate'
            - type: 'null'
      required: [datasetType]
      additionalProperties: false
    TriggerResponse:
      description: Spec §30 TriggerResponse.
      type: object
      properties:
        runId:
          $ref: './common.schema.json#/$defs/Uuid'
        datasetType:
          $ref: './price-observation.schema.json#/$defs/SourceDataset'
        triggeredBy:
          type: string
          const: MANUAL
        status:
          type: string
          const: RUNNING
        startedAt:
          $ref: './common.schema.json#/$defs/Timestamp'
        reportDateFrom:
          description: First report date requested (HISTORICAL_PRICE); null for CURRENT_PRICE.
          anyOf:
            - $ref: './common.schema.json#/$defs/CalendarDate'
            - type: 'null'
        reportDateTo:
          description: Last report date requested (HISTORICAL_PRICE); null for CURRENT_PRICE.
          anyOf:
            - $ref: './common.schema.json#/$defs/CalendarDate'
            - type: 'null'
      required: [runId, datasetType, triggeredBy, status, startedAt, reportDateFrom, reportDateTo]
      additionalProperties: false
    PauseScheduleRequest:
      type: object
      properties:
        reason:
          description: Why scheduled runs are paused, for example announced source maintenance.
          type: string
          minLength: 1
          maxLength: 500
      required: [reason]
      additionalProperties: false
    TransportAssumptionsUpdateRequest:
      description: The spec §32 parameters. Each must be greater than 0 (ADR-0020 item 1).
      type: object
      properties:
        ratePerKm:
          description: Rupees per km per trip (numeric(10,2)).
          type: number
          exclusiveMinimum: 0
          maximum: 99999999.99
          x-agrinex-max-decimal-places: 2
        minimumTripCharge:
          description: Rupees per trip (numeric(12,2)).
          type: number
          exclusiveMinimum: 0
          maximum: 9999999999.99
          x-agrinex-max-decimal-places: 2
        vehicleCapacityKg:
          description: Kilograms per trip (numeric(10,2)).
          type: number
          exclusiveMinimum: 0
          maximum: 99999999.99
          x-agrinex-max-decimal-places: 2
      required: [ratePerKm, minimumTripCharge, vehicleCapacityKg]
      additionalProperties: false
    TransportAssumptionResponse:
      description: Spec §30 TransportAssumptionResponse. One version.
      type: object
      properties:
        versionId:
          $ref: './common.schema.json#/$defs/Uuid'
        ratePerKm:
          type: number
          minimum: 0
          x-agrinex-max-decimal-places: 2
        minimumTripCharge:
          type: number
          minimum: 0
          x-agrinex-max-decimal-places: 2
        vehicleCapacityKg:
          type: number
          exclusiveMinimum: 0
          x-agrinex-max-decimal-places: 2
        active:
          description: true for the version new comparisons use.
          type: boolean
        createdAt:
          $ref: './common.schema.json#/$defs/Timestamp'
      required: [versionId, ratePerKm, minimumTripCharge, vehicleCapacityKg, active, createdAt]
      additionalProperties: false
    TransportAssumptionPage:
      allOf:
        - $ref: './common.schema.json#/$defs/PageMetadata'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransportAssumptionResponse'
      required: [items]
      unevaluatedProperties: false
    Weight:
      description: A scoring weight between 0 and 1, at most 4 decimal places (ADR-0020; numeric(6,4)).
      type: number
      minimum: 0
      maximum: 1
      x-agrinex-max-decimal-places: 4
    FreshnessDays:
      description: A freshness threshold in whole days.
      type: integer
      minimum: 0
      maximum: 2147483647
    WeightsUpdateRequest:
      description: >-
        Spec §16 weights and freshness thresholds (ADR-0024 defaults 0.55, 0.15, 0.10, 0.10, 0.10 and 1, 4, 10
        days). freshnessFreshDays <= freshnessRecentDays <= freshnessStaleDays (ADR-0020 item 1).
      type: object
      properties:
        wNetRealization:
          $ref: '#/components/schemas/Weight'
        wPrice:
          $ref: '#/components/schemas/Weight'
        wTrend:
          $ref: '#/components/schemas/Weight'
        wFreshness:
          $ref: '#/components/schemas/Weight'
        wTransportPenalty:
          $ref: '#/components/schemas/Weight'
        freshnessFreshDays:
          $ref: '#/components/schemas/FreshnessDays'
        freshnessRecentDays:
          $ref: '#/components/schemas/FreshnessDays'
        freshnessStaleDays:
          $ref: '#/components/schemas/FreshnessDays'
      required: [wNetRealization, wPrice, wTrend, wFreshness, wTransportPenalty, freshnessFreshDays, freshnessRecentDays, freshnessStaleDays]
      additionalProperties: false
    WeightsResponse:
      description: Spec §30 WeightsResponse. One version.
      type: object
      properties:
        versionId:
          $ref: './common.schema.json#/$defs/Uuid'
        wNetRealization:
          $ref: '#/components/schemas/Weight'
        wPrice:
          $ref: '#/components/schemas/Weight'
        wTrend:
          $ref: '#/components/schemas/Weight'
        wFreshness:
          $ref: '#/components/schemas/Weight'
        wTransportPenalty:
          $ref: '#/components/schemas/Weight'
        freshnessFreshDays:
          $ref: '#/components/schemas/FreshnessDays'
        freshnessRecentDays:
          $ref: '#/components/schemas/FreshnessDays'
        freshnessStaleDays:
          $ref: '#/components/schemas/FreshnessDays'
        active:
          type: boolean
        createdAt:
          $ref: './common.schema.json#/$defs/Timestamp'
      required: [versionId, wNetRealization, wPrice, wTrend, wFreshness, wTransportPenalty, freshnessFreshDays, freshnessRecentDays, freshnessStaleDays, active, createdAt]
      additionalProperties: false
    WeightsPage:
      allOf:
        - $ref: './common.schema.json#/$defs/PageMetadata'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeightsResponse'
      required: [items]
      unevaluatedProperties: false
    MarketReviewStatus:
      description: PROVISIONAL (registered from the feed, hidden from farmers), VERIFIED or MERGED (ADR-0014).
      type: string
      enum: [PROVISIONAL, VERIFIED, MERGED]
    MarketCoordinates:
      type: object
      properties:
        lat:
          $ref: './common.schema.json#/$defs/Latitude'
        lon:
          $ref: './common.schema.json#/$defs/Longitude'
        approximate:
          description: true when the coordinates are the district centroid (ADR-0014).
          type: boolean
        source:
          description: Provenance of the coordinates (markets.coordinate_source).
          type: string
          minLength: 1
          maxLength: 300
      required: [lat, lon, approximate, source]
      additionalProperties: false
    AdminMarketFields:
      description: Fields shared by AdminMarketResponse and AdminMarketDetailResponse.
      type: object
      properties:
        id:
          $ref: './common.schema.json#/$defs/Uuid'
        name:
          $ref: './common.schema.json#/$defs/ReferenceName'
        slug:
          description: >-
            Globally unique slug: the lower-case name with every run of non-alphanumeric characters replaced by one
            hyphen, plus a collision suffix (ADR-0014 item 6). Edge hyphens are kept, for example `pune-moshi-`.
          type: string
          minLength: 1
          maxLength: 220
          pattern: '^\S+$'
        district:
          $ref: './common.schema.json#/$defs/DistrictRef'
        state:
          $ref: './common.schema.json#/$defs/StateRef'
        reviewStatus:
          $ref: '#/components/schemas/MarketReviewStatus'
        active:
          type: boolean
        mergedIntoMarketId:
          description: Target of a merge; present exactly when reviewStatus is MERGED.
          anyOf:
            - $ref: './common.schema.json#/$defs/Uuid'
            - type: 'null'
        coordinates:
          description: The market coordinates, or null when the market has none (then it cannot be a comparison candidate).
          anyOf:
            - $ref: '#/components/schemas/MarketCoordinates'
            - type: 'null'
        createdAt:
          $ref: './common.schema.json#/$defs/Timestamp'
      required: [id, name, slug, district, state, reviewStatus, active, mergedIntoMarketId, coordinates, createdAt]
    AdminMarketResponse:
      allOf:
        - $ref: '#/components/schemas/AdminMarketFields'
      unevaluatedProperties: false
    MarketSourceAlias:
      description: One source spelling mapped to the market (spec §47 Q4 canonical mapping table; ADR-0014).
      type: object
      properties:
        sourceStateName:
          type: string
          minLength: 1
          maxLength: 100
        sourceDistrictName:
          type: string
          minLength: 1
          maxLength: 150
        sourceMarketName:
          description: Whitespace-normalized source spelling.
          type: string
          minLength: 1
          maxLength: 200
        sourceMarketNameRaw:
          description: The spelling exactly as first received, including edge or doubled spaces.
          type: string
          minLength: 1
          maxLength: 200
        evidenceNote:
          type: string
          minLength: 1
          maxLength: 500
        createdAt:
          $ref: './common.schema.json#/$defs/Timestamp'
      required: [sourceStateName, sourceDistrictName, sourceMarketName, sourceMarketNameRaw, evidenceNote, createdAt]
      additionalProperties: false
    AdminMarketDetailResponse:
      allOf:
        - $ref: '#/components/schemas/AdminMarketFields'
      properties:
        aliases:
          description: Source spellings mapped to the market, ordered by createdAt, then by source state, district and market name.
          type: array
          items:
            $ref: '#/components/schemas/MarketSourceAlias'
        latestReportDate:
          description: Newest report date stored for the market, or null.
          anyOf:
            - $ref: './common.schema.json#/$defs/CalendarDate'
            - type: 'null'
      required: [aliases, latestReportDate]
      unevaluatedProperties: false
    AdminMarketPage:
      allOf:
        - $ref: './common.schema.json#/$defs/PageMetadata'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminMarketResponse'
      required: [items]
      unevaluatedProperties: false
    MergeMarketRequest:
      type: object
      properties:
        targetMarketId:
          description: The market this one is the same as. Unknown answers 422 REFERENCE_NOT_FOUND.
          $ref: './common.schema.json#/$defs/Uuid'
        evidenceNote:
          description: Why the two spellings denote one market (ADR-0014; never fuzzy matching).
          type: string
          minLength: 1
          maxLength: 500
      required: [targetMarketId, evidenceNote]
      additionalProperties: false
    SetMarketCoordinatesRequest:
      type: object
      properties:
        lat:
          $ref: './common.schema.json#/$defs/Latitude'
        lon:
          $ref: './common.schema.json#/$defs/Longitude'
        coordinateSource:
          description: The identified source, for example the DMI National Agriculture Market Atlas with its date (ADR-0014).
          type: string
          minLength: 1
          maxLength: 300
      required: [lat, lon, coordinateSource]
      additionalProperties: false
    AdminCommodityResponse:
      type: object
      properties:
        id:
          $ref: './common.schema.json#/$defs/Uuid'
        name:
          $ref: './common.schema.json#/$defs/ReferenceName'
        nameHi:
          $ref: './common.schema.json#/$defs/LocalizedNameValue'
        nameMr:
          $ref: './common.schema.json#/$defs/LocalizedNameValue'
        category:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 100
            - type: 'null'
        priceUnit:
          description: Verified unit, or null while unverified (ingestion then rejects the commodity's records as UNIT_UNVERIFIED, ADR-0008).
          anyOf:
            - $ref: './price-observation.schema.json#/$defs/PriceUnit'
            - type: 'null'
        priceUnitSource:
          description: Official evidence of the unit, present exactly when priceUnit is present.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 300
            - type: 'null'
        createdAt:
          $ref: './common.schema.json#/$defs/Timestamp'
      required: [id, name, nameHi, nameMr, category, priceUnit, priceUnitSource, createdAt]
      additionalProperties: false
    AdminCommodityPage:
      allOf:
        - $ref: './common.schema.json#/$defs/PageMetadata'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminCommodityResponse'
      required: [items]
      unevaluatedProperties: false
    AddCommodityRequest:
      type: object
      properties:
        name:
          description: >-
            The commodity name exactly as the official source spells it. The server trims it and collapses each
            run of whitespace to one space before storing (ADR-0006; ck_commodities_name_normalized); a value that
            is empty after this answers 400 VALIDATION_FAILED with field code TOO_SHORT.
          $ref: './common.schema.json#/$defs/ReferenceName'
        category:
          description: Official Agmarknet commodity group, or null.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 100
            - type: 'null'
        priceUnit:
          $ref: './price-observation.schema.json#/$defs/PriceUnit'
        priceUnitSource:
          description: Official evidence of the unit, for example the Agmarknet report export and its date (ADR-0008).
          type: string
          minLength: 1
          maxLength: 300
        sourceReference:
          description: Official source reference for the commodity itself (ADR-0006 item 2). Kept in the audit details.
          type: string
          minLength: 1
          maxLength: 500
      required: [name, priceUnit, priceUnitSource, sourceReference]
      additionalProperties: false
    VerifyPriceUnitRequest:
      type: object
      properties:
        priceUnit:
          $ref: './price-observation.schema.json#/$defs/PriceUnit'
        priceUnitSource:
          type: string
          minLength: 1
          maxLength: 300
      required: [priceUnit, priceUnitSource]
      additionalProperties: false
    UpdateCommodityNamesRequest:
      type: object
      properties:
        nameHi:
          $ref: './common.schema.json#/$defs/LocalizedNameValue'
        nameMr:
          $ref: './common.schema.json#/$defs/LocalizedNameValue'
        provenanceNote:
          description: Source of the translations (ADR-0015 item 1). Kept in the audit details.
          type: string
          minLength: 1
          maxLength: 500
      required: [nameHi, nameMr, provenanceNote]
      additionalProperties: false
    DistrictAliasResponse:
      type: object
      properties:
        id:
          $ref: './common.schema.json#/$defs/Uuid'
        sourceStateName:
          type: string
          minLength: 1
          maxLength: 100
        sourceDistrictName:
          type: string
          minLength: 1
          maxLength: 150
        district:
          $ref: './common.schema.json#/$defs/DistrictRef'
        evidenceNote:
          type: string
          minLength: 1
          maxLength: 500
        createdAt:
          $ref: './common.schema.json#/$defs/Timestamp'
      required: [id, sourceStateName, sourceDistrictName, district, evidenceNote, createdAt]
      additionalProperties: false
    DistrictAliasPage:
      allOf:
        - $ref: './common.schema.json#/$defs/PageMetadata'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DistrictAliasResponse'
      required: [items]
      unevaluatedProperties: false
    AddDistrictAliasRequest:
      type: object
      properties:
        sourceStateName:
          description: >-
            The source State value. The server trims it and collapses each run of whitespace to one space before
            storing (ck_district_source_aliases_state_normalized); a value that is empty after this answers 400
            VALIDATION_FAILED with field code TOO_SHORT.
          type: string
          minLength: 1
          maxLength: 100
        sourceDistrictName:
          description: The source District value, normalized like sourceStateName.
          type: string
          minLength: 1
          maxLength: 150
        districtId:
          description: The LGD district it denotes. Unknown answers 422 REFERENCE_NOT_FOUND.
          $ref: './common.schema.json#/$defs/Uuid'
        evidenceNote:
          description: Official reference for the mapping (ADR-0014 item 3).
          type: string
          minLength: 1
          maxLength: 500
      required: [sourceStateName, sourceDistrictName, districtId, evidenceNote]
      additionalProperties: false
    AdminAuditAction:
      description: >-
        Audited admin actions (admin_audit_events.action; ADR-0020 item 6). The database list is closed: a new
        action needs a decision and a migration. Clients still tolerate values added in a later minor version.
        No HTTP operation writes ADMIN_BOOTSTRAPPED (startup, ADR-0028), ACCOUNT_ERASED (operator procedure,
        ADR-0037), ACCOUNT_DEACTIVATED or ACCOUNT_REACTIVATED (operator procedures, ADR-0041); they appear in
        the audit log only.
      type: string
      enum:
        - INGESTION_TRIGGERED
        - INGESTION_PAUSED
        - INGESTION_RESUMED
        - TRANSPORT_ASSUMPTIONS_UPDATED
        - RECOMMENDATION_WEIGHTS_UPDATED
        - MARKET_VERIFIED
        - MARKET_MERGED
        - MARKET_DEACTIVATED
        - MARKET_REACTIVATED
        - MARKET_COORDINATES_SET
        - COMMODITY_ADDED
        - COMMODITY_UNIT_VERIFIED
        - COMMODITY_NAMES_UPDATED
        - DISTRICT_ALIAS_ADDED
        - ADMIN_BOOTSTRAPPED
        - ACCOUNT_ERASED
        - ACCOUNT_DEACTIVATED
        - ACCOUNT_REACTIVATED
      x-agrinex-extensible: true
    AdminAuditEventResponse:
      type: object
      properties:
        id:
          $ref: './common.schema.json#/$defs/Uuid'
        action:
          $ref: '#/components/schemas/AdminAuditAction'
        actor:
          description: >-
            The ADMIN who acted; for ADMIN_BOOTSTRAPPED, the admin that was created (ADR-0028). Only the id is
            returned, as recorded (admin_audit_events.actor_user_id); no personal data of the actor is added.
          type: object
          properties:
            userId:
              $ref: './common.schema.json#/$defs/Uuid'
          required: [userId]
          additionalProperties: false
        targetType:
          description: Kind of object acted on, for example market, commodity, transport_assumptions, source_dataset or user.
          type: string
          minLength: 1
          maxLength: 50
        targetId:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 100
            - type: 'null'
        details:
          description: Masked before and after values and the justification. Never credentials (ADR-0020 item 5).
          type: object
          additionalProperties: true
          x-agrinex-free-form: true
        correlationId:
          anyOf:
            - type: string
              maxLength: 100
            - type: 'null'
        createdAt:
          $ref: './common.schema.json#/$defs/Timestamp'
      required: [id, action, actor, targetType, targetId, details, correlationId, createdAt]
      additionalProperties: false
    AdminAuditEventPage:
      allOf:
        - $ref: './common.schema.json#/$defs/PageMetadata'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAuditEventResponse'
      required: [items]
      unevaluatedProperties: false
