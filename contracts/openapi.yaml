openapi: 3.1.0
info:
  title: AgriNex API
  version: 1.1.0
  summary: REST contract between the AgriNex frontend, backend and QA (Phase 1).
  description: |
    Authoritative, hand-authored REST contract of AgriNex Phase 1 (spec P5, §41; ADR-0022; departure D-11).
    Code conforms to this document. A document generated from code is a build artifact used only to
    detect drift; it never overwrites this file.

    **Companion contract files** (same directory, referenced with `$ref`):
    `common.schema.json`, `price-observation.schema.json`, `recommendation.schema.json`,
    `error-response.schema.json`, `forecast-output.schema.json` (optional ML).
    Explanations: `docs/api/` (start at `docs/api/API_INDEX.md`).

    **Versioning.** The path carries the major version (`/api/v1`). `info.version` follows semantic
    versioning: additive changes raise the minor version, breaking changes the major version
    (ADR-0022 item 2). Changes follow the Shared Contract Change Rule (spec §41), and the mocks in
    `frontend/__mocks__/api/` change in the same change. Compatibility rules:
    `docs/api/API_CONVENTIONS.md` §2.

    **Conventions** (ADR-0022; `docs/api/API_CONVENTIONS.md`):
    - JSON bodies (`application/json`); errors are RFC 9457 `application/problem+json`
      (`ApiErrorResponse`), never with stack traces (spec §10, §28).
    - IDs are UUID strings; dates `yyyy-MM-dd` (Asia/Kolkata calendar, ADR-0007); instants RFC 3339,
      emitted in UTC.
    - Prices carry their verified unit (`priceUnit`, for example `Rs./Quintal`) and are never converted
      (ADR-0008). Computed amounts are ESTIMATED INR totals rounded half-up to 2 decimal places.
    - Every object that carries a price includes its observation ID, report date, freshness, dataset,
      variety, grade, unit and the spec §31 RULE 7 attribution. Responses that serve price data also carry
      `sourceStatus`, which drives the spec §29 synchronization banner (ADR-0022 item 9).
    - Lists are wrapped in an object with `items`. Paged lists take `page` (zero-based) and `size`
      (default 20, maximum 100) and return `PageMetadata` (ADR-0022 item 5).
    - Request bodies are closed: unknown properties are rejected. Clients must ignore unknown response
      properties and handle unknown values of enumerations marked `x-agrinex-extensible`.
    - Every response carries `X-Correlation-Id`.

    **Security.** JWT Bearer access tokens (15 minutes) and a rotating refresh token in an `HttpOnly`,
    `Secure`, `SameSite=Strict` cookie scoped to `/api/v1/auth` (spec §28; ADR-0016, ADR-0017). Each
    operation declares its `security` and its permitted roles (`x-agrinex-roles`). Only operations whose
    `security` lists `bearerAuth` evaluate an `Authorization` header. There a missing (where required), invalid
    or expired token, or a token whose account is inactive or no longer exists, answers 401; every such
    operation resolves the caller's account (ADR-0042). Every other operation ignores the header. The refresh
    cookie is `__Secure-agrinex_refresh` (ADR-0042). Frontend and API share one origin; the refresh and logout
    operations also require a matching `Origin` header (ADR-0017). Email verification and password recovery use
    single-use, time-limited links sent to the account's email, and their operations never reveal whether an
    account exists (ADR-0047, ADR-0048). Security-sensitive: changes need explicit human review (CLAUDE.md
    rule 16).

    **Scope.** Phase 1 only. Phase 2 path groups (`/api/v1/listings`, `/bids`, `/transactions`,
    `/ratings`, spec §30) are not defined until RD-012 and RD-025 are resolved after the Phase 1 freeze
    (HARD RULE 1; ADR-0032). The forecast operation belongs to the optional ML track
    (`x-agrinex-phase: OPTIONAL_ML`, ADR-0030): AgriNex works completely without it, and no other
    operation depends on ML (spec P9, §35).

    **Data honesty.** All prices are government-reported observations from data.gov.in (DMI), stored by
    AgriNex. Nothing is fabricated, interpolated, averaged into a displayed price or relabelled as current
    (spec P10, §31; ADR-0005, ADR-0010). Prices are "latest reported", never "real-time" (spec §31 RULE 4).
  x-agrinex-contract-files:
    common.schema.json: 1.0.0
    price-observation.schema.json: 1.0.0
    recommendation.schema.json: 1.0.0
    error-response.schema.json: 1.0.0
    forecast-output.schema.json: 1.0.0
servers:
  - url: /
    description: >-
      Same origin. Nginx routes /api/v1/ to the backend and every other path to the frontend; /actuator/
      is not public (ADR-0017).
tags:
  - name: Auth
    description: >-
      Registration, login, token refresh, logout, email verification and password recovery (auth module; spec
      §10, §30; ADR-0016, ADR-0017, ADR-0047, ADR-0048).
  - name: Geography
    description: State, district and locality reference data for the location wizard (geography module; F1.3).
  - name: Commodities
    description: Commodities, varieties and grades for the comparison wizard (commodity module; F1.4).
  - name: Markets
    description: Market detail, latest reported prices, trends and the optional forecast (price module; §30, §33).
  - name: Selling options
    description: Transport-aware market comparison and What-If simulation (recommendation module; §16, §17).
  - name: Alerts
    description: Farmer price alerts and their in-app events (alert module; §34; ADR-0019).
  - name: Admin - System
    description: Read-only system status for administrators (admin module; ADR-0020).
  - name: Admin - Ingestion
    description: Ingestion health, run history, errors, manual trigger, pause and resume (admin module; FR-18; ADR-0011, ADR-0020).
  - name: Admin - Configuration
    description: Versioned transport assumptions and recommendation weights (admin module; §30, §32; ADR-0020).
  - name: Admin - Curation
    description: Market, commodity and district-alias curation with evidence (admin module; ADR-0014, ADR-0020).
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerFarmer
      summary: Quick registration of a farmer with a mobile number and an email address
      description: |
        Creates a FARMER account and signs the farmer in (spec §25 "Quick phone registration (lightweight)";
        ADR-0016 item 3, amended by ADR-0047: an email address is also required, departure D-15). There is no SMS
        or OTP in Phase 1 (spec §39). The response sets the refresh-token cookie. The new account's email is
        unverified; a verification link is sent to it after the response (ADR-0048), and a verified email is what
        password recovery uses. ADMIN accounts are provisioned, never self-registered (ADR-0028); BUYER
        registration is Phase 2 (ADR-0032).
        Without OTP (spec §39; ADR-0016) the 409 response necessarily reveals that a number or an email is
        registered; the register rate limit bounds such probing (ADR-0017). This residual risk is accepted for
        Phase 1 and is revisited when Phase 2 brings OTP (ADR-0042, SR-01; extended to email by ADR-0048). A number
        or email claimed by someone else is freed by the operator erasure procedure (ADR-0037).
      x-agrinex-module: auth
      x-agrinex-roles: []
      x-agrinex-phase: '1'
      x-agrinex-rate-limit: 10 requests per minute per client IP (ADR-0017)
      x-agrinex-trace: [spec §10, spec §25, spec §28, ADR-0016, ADR-0017, ADR-0047, ADR-0048]
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and signed in.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Refresh'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: >-
            CONFLICT. The mobile number or the email address is already registered; errors[] names phoneNumber
            or email (or both) with code ALREADY_EXISTS.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '422':
          $ref: '#/components/responses/ReferenceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with one identifier and a password
      description: |
        Signs in with one `identifier` and the account's single password (ADR-0016 items 2 and 3; ADR-0047):
        a FARMER uses the mobile number or the email address of the same account, and an ADMIN uses the email
        address. The response sets the refresh-token cookie and returns a 15-minute access token. Wrong credentials, unknown identifiers and inactive accounts all answer 401
        INVALID_CREDENTIALS, so the response does not reveal whether an account exists. To keep that true:
        - the failed-login limit (10 per identifier per 15 minutes, ADR-0017) counts the normalized identifier
          (trimmed; email in lower case; phone in E.164) and counts unknown identifiers exactly like known ones;
          the mobile number and the email of one account are counted separately, so a response never reveals that
          the two belong together (ADR-0048);
        - while an identifier is over the limit, every login for it answers 429, even with the correct password;
        - an unknown identifier still costs one BCrypt verification, so timing does not reveal existence;
        - a password longer than 72 bytes in UTF-8 answers 400 VALIDATION_FAILED (TOO_LONG); it is never
          truncated (ADR-0016 item 3).
      x-agrinex-module: auth
      x-agrinex-roles: []
      x-agrinex-phase: '1'
      x-agrinex-rate-limit: 10 requests per minute per client IP; 10 failed logins per identifier per 15 minutes (ADR-0017)
      x-agrinex-trace: [spec §10, spec §28, ADR-0016, ADR-0017, ADR-0047]
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Refresh'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: INVALID_CREDENTIALS.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            WWW-Authenticate:
              $ref: '#/components/headers/WWW-Authenticate'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidCredentialsError'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: |
        Exchanges the refresh-token cookie for a new access token and a rotated refresh token in the same
        token family (ADR-0016 item 5). The request has no body. A missing, unknown, expired or revoked
        token answers 401 REFRESH_TOKEN_INVALID; presenting a revoked token also revokes its whole family
        (RFC 9700 §4.14.2). A token of an account that is inactive (spec §20 is_active) or no longer exists
        answers the same 401 and its family is revoked, so a deactivated account cannot extend its session.
        The client must then sign in again and must never retry the refresh.
        The `Origin` header must equal the public origin (ADR-0017 item 3). Clients serialize refresh calls
        so that parallel tabs do not trigger reuse detection.
        A 429 is not a sign-out: the request was rejected before its token was processed, so the client waits
        `Retry-After` seconds and retries once (ADR-0042, SR-14).
      x-agrinex-module: auth
      x-agrinex-roles: []
      x-agrinex-phase: '1'
      x-agrinex-rate-limit: 10 requests per minute per client IP (ADR-0017)
      x-agrinex-trace: [spec §10, spec §27, spec §28, spec §29, ADR-0016, ADR-0017]
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: Session refreshed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Refresh'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: REFRESH_TOKEN_INVALID. The response also clears the refresh-token cookie.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            WWW-Authenticate:
              $ref: '#/components/headers/WWW-Authenticate'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Clear'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RefreshTokenInvalidError'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out and revoke the refresh-token family
      description: |
        Revokes the token family of the presented refresh-token cookie and clears the cookie (ADR-0016
        item 5). Idempotent: without a valid cookie it still answers 204. The `Origin` header must equal the
        public origin (ADR-0017). The client discards its in-memory access token, which expires within
        15 minutes.
      x-agrinex-module: auth
      x-agrinex-roles: []
      x-agrinex-phase: '1'
      x-agrinex-trace: [spec §10, ADR-0016, ADR-0017]
      security:
        - refreshCookie: []
        - {}
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '204':
          description: Signed out.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Clear'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Ask for a password-reset link by email
      description: |
        Starts password recovery (ADR-0047). The `identifier` is the account's mobile number or email address,
        normalized like login's. The answer is always 202 with no body, whether or not an account exists, so the
        response never reveals an account (ADR-0048):
        - a reset link is sent only when the identifier belongs to an active account whose email is verified. It
          goes to that verified email, never to an address taken from the request;
        - the link carries a single-use token of 256 random bits, valid for 30 minutes. Only its SHA-256 hash is
          stored, and a new request replaces any earlier link of the account;
        - the email is sent after the response is returned, so the response time does not depend on whether a
          link was sent;
        - the per-identifier limit counts the normalized identifier and counts unknown identifiers exactly like
          known ones; while an identifier is over it, every request for it answers 429.
        No SMS or OTP is used (spec §39; ADR-0047).
      x-agrinex-module: auth
      x-agrinex-roles: []
      x-agrinex-phase: '1'
      x-agrinex-rate-limit: 10 requests per minute per client IP; 3 requests per identifier per hour (ADR-0048)
      x-agrinex-trace: [spec §28, spec §39, ADR-0016, ADR-0017, ADR-0047, ADR-0048]
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: >-
            Accepted. If an active account with a verified email matches the identifier, a reset link is on its way
            to that email. The response is the same when nothing matches.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/auth/password-reset/confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      summary: Set a new password with the token from a reset link
      description: |
        Completes password recovery (ADR-0047, ADR-0048). The `token` comes from the reset link sent to the
        account's verified email. On success, in one transaction:
        - the password is replaced (BCrypt, ADR-0016) and the token is spent;
        - every refresh-token family of the account is revoked, so every session must sign in again.

        The response clears the refresh-token cookie, and a "password changed" notice is sent to the verified
        email afterwards. The user is not signed in by this operation: they sign in with the new password.
        An unknown, expired, spent or replaced token, or a token of an account that is no longer active, answers
        422 PASSWORD_RESET_TOKEN_INVALID.
        `newPassword` follows the account's rule (ADR-0016 item 3): 8 to 64 characters for FARMER, 15 to 64 for
        ADMIN, never more than 72 bytes in UTF-8 and never truncated. Below the ADMIN minimum it answers 400
        VALIDATION_FAILED with TOO_SHORT on `newPassword`.
      x-agrinex-module: auth
      x-agrinex-roles: []
      x-agrinex-phase: '1'
      x-agrinex-rate-limit: 10 requests per minute per client IP (ADR-0048)
      x-agrinex-trace: [spec §28, ADR-0016, ADR-0017, ADR-0047, ADR-0048]
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Password changed. Every session of the account is signed out.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Clear'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: >-
            PASSWORD_RESET_TOKEN_INVALID. The token is unknown, expired, spent or replaced, or its account is no
            longer active. The client offers to request a new link.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PasswordResetTokenInvalidError'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/auth/email-verification/confirm:
    post:
      tags: [Auth]
      operationId: confirmEmailVerification
      summary: Confirm the account's email with the token from a verification link
      description: |
        Marks the account's email address as verified (ADR-0047, ADR-0048). The `token` comes from the
        verification link sent after registration or on request. It holds 256 random bits, is valid for 24 hours
        and is single-use; only its SHA-256 hash is stored. No sign-in is needed, so the link works on any device.
        Password recovery sends reset links only to a verified email. An unknown, expired, spent or replaced
        token, or a token of an account that is no longer active, answers 422 EMAIL_VERIFICATION_TOKEN_INVALID;
        once an email is verified, its links are spent.
      x-agrinex-module: auth
      x-agrinex-roles: []
      x-agrinex-phase: '1'
      x-agrinex-rate-limit: 10 requests per minute per client IP (ADR-0048)
      x-agrinex-trace: [spec §28, ADR-0047, ADR-0048]
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
      responses:
        '204':
          description: The email address is verified.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: >-
            EMAIL_VERIFICATION_TOKEN_INVALID. The token is unknown, expired, spent or replaced, or its account is no
            longer active. A signed-in user can ask for a new link (resendEmailVerification).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EmailVerificationTokenInvalidError'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/auth/email-verification/resend:
    post:
      tags: [Auth]
      operationId: resendEmailVerification
      summary: Send a new verification link to the signed-in account's email
      description: |
        Sends a new verification link to the caller's own email address while it is not verified, replacing any
        earlier link (ADR-0048). The request has no body. The answer is 202 with no body; when the email is
        already verified, nothing is sent. `AuthenticatedUser.emailVerified` tells the client whether to offer
        this action.
      x-agrinex-module: auth
      x-agrinex-roles: [FARMER, ADMIN]
      x-agrinex-phase: '1'
      x-agrinex-rate-limit: 10 requests per minute per client IP; 3 requests per account per hour (ADR-0048)
      x-agrinex-trace: [spec §28, ADR-0047, ADR-0048]
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Accepted. A new link is on its way when the email is not yet verified.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/geography/states:
    get:
      tags: [Geography]
      operationId: listStates
      summary: List states
      description: >-
        States offered in the location wizard, ordered by name (code-point order, then id) (F1.3; spec §30 StateResponse). Phase 1 holds
        Maharashtra only (ADR-0006). Not paginated (ADR-0022 item 5).
      x-agrinex-module: geography
      x-agrinex-roles: []
      x-agrinex-phase: '1'
      x-agrinex-trace: [spec F1.3, spec §30, ADR-0006, ADR-0015, ADR-0022]
      security:
        - {}
      responses:
        '200':
          description: The states.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateListResponse'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/geography/states/{stateId}/districts:
    get:
      tags: [Geography]
      operationId: listDistricts
      summary: List the districts of a state
      description: >-
        Districts of the state, ordered by name (code-point order, then id), each with the centroid the frontend sends as the comparison
        origin (spec §21 step 3, FR-06; ADR-0014). Names follow the Local Government Directory. Not
        paginated.
      x-agrinex-module: geography
      x-agrinex-roles: []
      x-agrinex-phase: '1'
      x-agrinex-trace: [spec F1.3, spec FR-06, spec §21, spec §30, ADR-0014]
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/StateIdPath'
      responses:
        '200':
          description: The districts; an empty items array when the state has none.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistrictListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/geography/districts/{districtId}/localities:
    get:
      tags: [Geography]
      operationId: listLocalities
      summary: List the localities of a district
      description: >-
        Localities (LGD sub-districts, talukas) of the district, ordered by name (code-point order, then id) (F1.3; ADR-0014). The
        locality never changes the comparison origin, which is always the district centroid (ADR-0014 item 1),
        so localities carry no coordinates. Not paginated.
      x-agrinex-module: geography
      x-agrinex-roles: []
      x-agrinex-phase: '1'
      x-agrinex-trace: [spec F1.3, spec §25, spec §30, ADR-0014]
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/DistrictIdPath'
      responses:
        '200':
          description: The localities; an empty items array when the district has none.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalityListResponse'
        '400':
