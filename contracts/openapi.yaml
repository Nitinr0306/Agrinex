      x-agrinex-roles: []
      x-agrinex-phase: '1'
      x-agrinex-rate-limit: 60 requests per minute per client IP, shared with simulate (spec §28; ADR-0017)
      x-agrinex-trace: [spec §16, spec §21, spec §28, spec §29, spec §30, spec §32, ADR-0010, ADR-0022, ADR-0023, ADR-0024, ADR-0025, ADR-0026, ADR-0039, ADR-0040, ADR-0042]
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './recommendation.schema.json#/$defs/CompareRequest'
      responses:
        '200':
          description: The comparison.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketComparisonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/CompareUnprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/selling-options/simulate:
    post:
      tags: [Selling options]
      operationId: simulateSellingOptions
      summary: Server-side What-If simulation
      description: |
        Re-runs a comparison with hypothetical overrides (spec §17; ADR-0026). The client calls it only when
        the maximum distance is raised above the original radius; every other What-If change is recalculated
        in the browser with the spec §32 formula and the comparison response's transportAssumptions (spec §10;
        ADR-0026 items 1 and 3; departure D-13). The server uses the original run's weights and
        transport-assumption versions, selects observations again at simulation time (ADR-0010), ranks by
        estimated net realization and persists nothing (spec §32 "session-only"). The response is a
        MarketComparisonResponse with `scenario.kind: SIMULATION` and the overrides in `scenario.userOverrides`.
        Overrides never alter an observed price, but re-selection can show newer observations than the original
        comparison; the client then uses this response as its new base.
        The client sends only the values the user changed: an omitted value keeps the original, so an original
        quantity outside the simulator range (spec §17) is never sent as an override.
        The recommendationId is an unguessable identifier returned only to the caller of the comparison; whoever
        holds it can simulate that run and sees its origin district centroid and quantity. Because the origin is
        always a validated district centroid (ADR-0039), this is accepted (ADR-0042, SR-02). A sent token is
        resolved to its account; an inactive or removed account answers 401 UNAUTHORIZED (ADR-0042, SR-04).
      x-agrinex-module: recommendation
      x-agrinex-roles: []
      x-agrinex-phase: '1'
      x-agrinex-rate-limit: 60 requests per minute per client IP, shared with compare (spec §28; ADR-0017)
      x-agrinex-trace: [spec §10, spec §17, spec §30, spec §32, ADR-0026]
      security:
